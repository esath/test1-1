# Default values for awx-netbox-frontend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: awx-netbox-frontend
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# OpenShift Route configuration
route:
  enabled: true
  host: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Ingress configuration (alternative to route)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: awx-frontend.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# Environment variables
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
  - name: LOG_LEVEL
    value: "info"

# Configuration from ConfigMap
envFrom:
  - configMapRef:
      name: awx-netbox-config

# Secrets (for sensitive data)
secrets:
  netbox:
    token: ""
  awx:
    username: "admin"
    password: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

# Node selector for OpenShift
nodeSelector: {}

tolerations: []

affinity: {}

# Configuration values
config:
  netbox:
    url: "https://netbox.example.com"
  awx:
    url: "https://awx.example.com"
    jobTemplateId: "1"
    rollbackTemplateId: "2"
    inventoryId: "1"

# Persistent storage (if needed for task history)
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
