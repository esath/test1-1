apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "awx-netbox-frontend.fullname" . }}
  labels:
    {{- include "awx-netbox-frontend.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "awx-netbox-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "awx-netbox-frontend.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "awx-netbox-frontend.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- toYaml .Values.env | nindent 12 }}
            - name: NETBOX_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "awx-netbox-frontend.fullname" . }}-config
                  key: netbox-url
            - name: AWX_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "awx-netbox-frontend.fullname" . }}-config
                  key: awx-url
            - name: AWX_JOB_TEMPLATE_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "awx-netbox-frontend.fullname" . }}-config
                  key: awx-job-template-id
            - name: AWX_ROLLBACK_TEMPLATE_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "awx-netbox-frontend.fullname" . }}-config
                  key: awx-rollback-template-id
            - name: AWX_INVENTORY_ID
              valueFrom:
                configMapKeyRef:
                  name: {{ include "awx-netbox-frontend.fullname" . }}-config
                  key: awx-inventory-id
            - name: NETBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "awx-netbox-frontend.fullname" . }}-secrets
                  key: netbox-token
            - name: AWX_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "awx-netbox-frontend.fullname" . }}-secrets
                  key: awx-username
            - name: AWX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "awx-netbox-frontend.fullname" . }}-secrets
                  key: awx-password
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
